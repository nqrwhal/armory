[project]
name = "armory"
version = "0.1.0"
description = "Personal listing monitor & search across Calguns, Tacswap, GAFShub, and CAGuns"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "curl_cffi>=0.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
armory = "armory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
